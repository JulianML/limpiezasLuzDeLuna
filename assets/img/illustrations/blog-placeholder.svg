  <g transform="translate(252 198) rotate(6)" opacity="0.85">
    <rect x="0" y="0" width="58" height="14" rx="3" fill="#dddee8" stroke="#b8bccc" stroke-width="1"/>
    <line x1="8" y1="5" x2="38" y2="5" stroke="#9ea3b8" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="8" y1="9" x2="30" y2="9" stroke="#9ea3b8" stroke-width="1.5" stroke-linecap="round"/>
  </g>
