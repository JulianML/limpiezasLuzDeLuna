<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="bgPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f5fb"/>
      <stop offset="100%" stop-color="#e2e5ef"/>
    </linearGradient>
    <linearGradient id="paperSheet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef0f7"/>
    </linearGradient>
    <linearGradient id="penBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ea3b8"/>
      <stop offset="100%" stop-color="#6b7088"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#bgPaper)"/>

  <g opacity="0.55">
    <line x1="0" y1="60" x2="400" y2="60" stroke="#dde0ec" stroke-width="1"/>
    <line x1="0" y1="120" x2="400" y2="120" stroke="#dde0ec" stroke-width="1"/>
    <line x1="0" y1="180" x2="400" y2="180" stroke="#dde0ec" stroke-width="1"/>
    <line x1="0" y1="240" x2="400" y2="240" stroke="#dde0ec" stroke-width="1"/>
  </g>

  <g transform="translate(82 56) rotate(-4)">
    <rect x="0" y="0" width="180" height="220" rx="6" fill="url(#paperSheet)" stroke="#c8ccd9" stroke-width="1.5"/>
    <line x1="20" y1="38" x2="160" y2="38" stroke="#b8bccc" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="62" x2="148" y2="62" stroke="#b8bccc" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="86" x2="155" y2="86" stroke="#b8bccc" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="110" x2="120" y2="110" stroke="#b8bccc" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="134" x2="150" y2="134" stroke="#b8bccc" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="158" x2="100" y2="158" stroke="#b8bccc" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="182" x2="135" y2="182" stroke="#b8bccc" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="206" x2="80" y2="206" stroke="#b8bccc" stroke-width="2" stroke-linecap="round"/>
  </g>

  <g transform="translate(178 168) rotate(38)">
