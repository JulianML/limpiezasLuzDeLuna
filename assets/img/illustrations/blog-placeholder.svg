    <rect x="0" y="0" width="14" height="22" rx="3" fill="#4a4f6b"/>
    <polygon points="0,118 14,118 7,134" fill="#2a2d3f"/>
    <polygon points="5,124 9,124 7,134" fill="#1a1d3f"/>
    <line x1="3" y1="30" x2="11" y2="30" stroke="#ffffff" stroke-width="1" opacity="0.4"/>
