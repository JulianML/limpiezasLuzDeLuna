[build]
  publish = "_site"
  command = "node scripts/build.js"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@libsql/client", "libsql", "@libsql/linux-x64-gnu"]

[dev]
  framework = "#static"
  command = "npx --yes http-server -p 8889 -c-1 --cors"
  targetPort = 8889
  port = 8888

[[headers]]
  for = "/backoffice/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"

# =============================================================================
# Blog dinámico: el contenido SIEMPRE se sirve desde la DB.
# Mantenemos las URLs limpias (/blog/post/<slug>/) pero el servidor
# reescribe internamente a blog/post.html?slug=<slug> para que la página
# dinámica (blog.js) renderice el post en cada petición. Así los cambios
# del backoffice son visibles sin esperar a un `npm run build`.
# =============================================================================
[[redirects]]
  from = "/blog/post/:slug"
  to = "/blog/post"
  status = 200
  query = {slug = ":slug"}
  force = true

# Cinturón y tirantes: aunque el build ya excluye estos archivos,
# bloqueamos cualquier ruta que intente acceder a ficheros sensibles
# (.env, package.json, lib/, scripts/, node_modules/, git, etc.).
[[redirects]]
  from = "/.env"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.env.example"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.env.local"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.env.*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/lib/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.git/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/node_modules/*"
  to = "/404"
  status = 404
  force = true
